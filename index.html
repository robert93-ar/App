<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #06b6d4; /* Cyan */
            --success: #10b981; /* Green */
            --danger: #ef4444; /* Red */
            --gold: #f59e0b;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- LAYOUT --- */
        #app-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 80px; /* Space for nav */
        }

        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid #334155;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            z-index: 100;
        }

        nav button {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        nav button.active { color: var(--accent); }

        /* --- COMPONENTS --- */
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        h1, h2, h3 { margin: 0 0 10px 0; }
        .subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 15px; display: block; }

        button.btn-primary {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            width: 100%;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 10px;
        }
        
        button.btn-danger { background: var(--danger); color: white; }
        button.btn-success { background: var(--success); color: white; }
        button.btn-outline { background: transparent; border: 1px solid #475569; color: var(--text); }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-val { font-size: 1.5rem; font-weight: bold; color: var(--accent); }
        .stat-label { font-size: 0.75rem; color: #94a3b8; }

        /* --- SESSION PLAYER --- */
        .visual-container {
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #0f172a;
            border-radius: 16px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .timer-display {
            font-size: 3.5rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            z-index: 10;
        }

        .trainer-card {
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
        }
        .trainer-card h4 { color: var(--accent); margin-bottom: 5px; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .trainer-card ul { margin: 0; padding-left: 20px; color: #e2e8f0; font-size: 0.95rem; line-height: 1.5; }

        /* --- CSS VISUALS --- */
        /* Vector Scope (Radar) */
        .scope-ring {
            position: absolute;
            width: 200px; height: 200px;
            border: 2px solid #334155;
            border-radius: 50%;
        }
        .scope-target {
            position: absolute;
            width: 20px; height: 20px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--accent);
            opacity: 0;
            transition: all 1s ease;
        }
        /* Cylinder (Pump) */
        .cyl-body {
            width: 100px; height: 200px;
            border: 3px solid #475569;
            border-radius: 10px;
            position: relative;
            background: rgba(255,255,255,0.05);
        }
        .cyl-fill {
            position: absolute;
            bottom: 0; left: 10px; right: 10px;
            background: var(--accent);
            opacity: 0.5;
            height: 0%;
            transition: height 1s ease;
            border-radius: 5px;
        }
        .cyl-danger {
            position: absolute; top: 0; width: 100%; height: 20px;
            background: rgba(239, 68, 68, 0.2);
            border-bottom: 1px dashed var(--danger);
        }

        /* --- SETTINGS TOGGLES --- */
        .toggle-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 0; border-bottom: 1px solid #334155;
        }
        .switch {
            position: relative; display: inline-block; width: 50px; height: 28px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #475569; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 20px; width: 20px; left: 4px; bottom: 4px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(22px); }

        /* --- HANDBOOK ACCORDION --- */
        .accordion {
            background: #0f172a;
            border: 1px solid #334155;
            margin-bottom: 10px;
            border-radius: 8px;
            overflow: hidden;
        }
        .accordion-header {
            padding: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex; justify-content: space-between;
        }
        .accordion-content {
            padding: 0 15px 15px 15px;
            display: none;
            color: #cbd5e1;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .accordion.open .accordion-content { display: block; }

    </style>
</head>

    class AudioEngine {
        constructor() {

        async init() {
            if (!this.ctx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
                this.gainNode = this.ctx.createGain();
                this.gainNode.connect(this.ctx.destination);
                this.gainNode.gain.value = 0; // Start Muted

            if (this.ctx.state === 'suspended') {

            }

        createNoiseBuffer() {
            const bufferSize = this.ctx.sampleRate * 2; // 2 seconds
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;

            // Brown Noise Filter (Low Pass)
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 150; 

            noise.connect(filter);
            filter.connect(this.gainNode);
            noise.start();
        }

            const now = this.ctx.currentTime;
            this.gainNode.gain.cancelScheduledValues(now);
            this.gainNode.gain.linearRampToValueAtTime(target, now + 0.5); // Smooth fade
            this.isPlaying = enable;
        }
